name: NGO website readiness
on:
  pull_request:
    branches: [main]
    paths: ['web/**', 'functions/**', '.github/workflows/ngo-readiness.yml']
jobs:
  ngo-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: web
      - run: npm exec vitest run src/utils/fundTransactionStatus.test.ts api/_confirm-donation.test.ts
        working-directory: web
      - run: npm exec vite build
        working-directory: web
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: functions
      - run: npm run build
        working-directory: functions
